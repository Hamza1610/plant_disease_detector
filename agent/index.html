<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnivax Helper Agent Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #030303;
        }
        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-panel {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(147, 51, 234, 0.2);
            border-radius: 999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(147, 51, 234, 0.4);
        }
    </style>
</head>
<body class="text-gray-300 min-h-screen flex flex-col selection:bg-purple-500/20 selection:text-purple-300">
    <!-- Header -->
    <header class="border-b border-white/5 py-4 px-8 flex justify-between items-center bg-[#070707]/90 sticky top-0 z-50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-extrabold text-black text-sm shadow-[0_0_20px_rgba(147,51,234,0.35)]">
                Ox
            </div>
            <div>
                <h1 class="text-white font-bold text-base tracking-tight flex items-center gap-2">
                    Omnivax Helper Agent
                    <span id="connection-badge" class="inline-flex items-center px-2 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider bg-red-500/10 text-red-400 border border-red-500/20">
                        Offline
                    </span>
                </h1>
                <p class="text-[9px] text-gray-500 uppercase tracking-widest font-semibold mt-0.5">Developer Workspace Console</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4 text-xs">
            <div class="text-gray-500 font-medium">
                Server: <span class="text-gray-300 font-mono" id="server-url">ws://localhost:8088/ws</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow flex p-6 gap-6 max-w-7xl mx-auto w-full h-[calc(100vh-76px)] overflow-hidden">
        <!-- Control Deck (Left Sidebar) -->
        <section class="w-80 flex flex-col gap-5 shrink-0 h-full overflow-hidden">
            <!-- Workspace Info -->
            <div class="glass-panel rounded-2xl p-5 flex flex-col gap-3">
                <h3 class="text-white font-bold text-[10px] uppercase tracking-wider text-purple-400">Workspace Deck</h3>
                <div class="text-xs flex flex-col gap-2">
                    <div class="flex justify-between items-center border-b border-white/5 pb-1.5">
                        <span class="text-gray-500">Directory</span>
                        <span class="text-gray-300 font-mono truncate max-w-[150px]" title="omnivax">omnivax/</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-white/5 pb-1.5">
                        <span class="text-gray-500">Local Port</span>
                        <span class="text-gray-300 font-mono">8088</span>
                    </div>
                </div>
            </div>

            <!-- Quick Action Tasks -->
            <div class="glass-panel rounded-2xl p-5 flex flex-col gap-3">
                <h3 class="text-white font-bold text-[10px] uppercase tracking-wider text-purple-400">Action Templates</h3>
                <div class="flex flex-col gap-2 mt-1">
                    <button id="btn-scan" class="w-full py-2.5 bg-white/5 hover:bg-white/10 active:scale-[0.98] border border-white/5 text-[11px] text-gray-300 font-semibold rounded-xl flex items-center px-3 gap-2 transition-all">
                        <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                        Scan Workspace
                    </button>
                    
                    <button id="btn-test" class="w-full py-2.5 bg-white/5 hover:bg-white/10 active:scale-[0.98] border border-white/5 text-[11px] text-gray-300 font-semibold rounded-xl flex items-center px-3 gap-2 transition-all">
                        <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Test Config
                    </button>

                    <button id="btn-deploy" class="w-full py-2.5 bg-white/5 hover:bg-white/10 active:scale-[0.98] border border-white/5 text-[11px] text-gray-300 font-semibold rounded-xl flex items-center px-3 gap-2 transition-all">
                        <svg class="w-3.5 h-3.5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Deploy Config
                    </button>
                </div>
            </div>

            <!-- Past Conversations -->
            <div class="glass-panel rounded-2xl p-5 flex flex-col gap-3 flex-grow overflow-hidden">
                <div class="flex justify-between items-center border-b border-white/5 pb-2">
                    <h3 class="text-white font-bold text-[10px] uppercase tracking-wider text-purple-400">Chat History</h3>
                    <button id="btn-new-chat" class="text-[10px] text-purple-450 hover:text-purple-300 font-bold tracking-wider transition-colors">
                        + New
                    </button>
                </div>
                <div id="history-list" class="flex flex-col gap-1.5 overflow-y-auto custom-scrollbar flex-grow pr-1">
                    <p class="text-[11px] text-gray-600 italic text-center py-4">No sessions found</p>
                </div>
            </div>
        </section>

        <!-- Chat Console & Terminal Panel -->
        <section class="flex-grow flex flex-col glass-panel rounded-3xl overflow-hidden relative">
            <!-- Messages Log -->
            <div id="messages-container" class="flex-grow p-8 overflow-y-auto flex flex-col gap-5 custom-scrollbar">
                <!-- Messages injected here -->
            </div>

            <!-- Agent Working Status log (Fixed above input bar) -->
            <div id="status-bar" class="hidden px-8 py-3 bg-purple-950/10 border-t border-purple-500/10 flex items-center gap-3">
                <div class="h-2 w-2 bg-purple-400 rounded-full animate-ping"></div>
                <p id="status-text" class="text-xs text-purple-300 font-medium italic"></p>
            </div>

            <!-- Input area -->
            <form id="input-form" class="p-6 border-t border-white/5 bg-[#070707]/60">
                <div class="flex bg-white/5 border border-white/5 rounded-2xl overflow-hidden focus-within:border-purple-500/40 transition-colors shadow-inner">
                    <textarea
                        id="user-input"
                        rows="1"
                        placeholder="Talk to your agent (e.g. 'Draft a ResNet configuration file for Orange Spots')"
                        class="flex-grow bg-transparent px-5 py-4 text-sm text-white focus:outline-none placeholder-gray-600 resize-none h-[54px] custom-scrollbar"
                    ></textarea>
                    <button
                        type="submit"
                        id="btn-send"
                        disabled
                        class="px-6 text-purple-400 hover:bg-white/5 transition-all disabled:opacity-30 disabled:hover:bg-transparent flex items-center justify-center"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </form>
        </section>
    </main>

    <!-- UI Logic -->
    <script>
        const messagesContainer = document.getElementById('messages-container');
        const statusBar = document.getElementById('status-bar');
        const statusText = document.getElementById('status-text');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');
        const btnSend = document.getElementById('btn-send');
        const connectionBadge = document.getElementById('connection-badge');
        const serverUrlDisplay = document.getElementById('server-url');
        const historyList = document.getElementById('history-list');

        // Buttons
        const btnScan = document.getElementById('btn-scan');
        const btnTest = document.getElementById('btn-test');
        const btnDeploy = document.getElementById('btn-deploy');
        const btnNewChat = document.getElementById('btn-new-chat');

        let ws = null;
        let currentSessionId = null;

        // Auto-configure WebSocket address based on host page location
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';

        function addMessage(sender, text, isHistory = false) {
            const wrapper = document.createElement('div');
            
            // Format system tool/execution logs differently
            if (sender === 'system') {
                wrapper.className = 'max-w-[95%] self-start flex flex-col gap-1 my-1 pl-4 border-l-2 border-white/5';
                const log = document.createElement('div');
                log.className = 'code-font text-[11px] text-gray-500 bg-white/[0.02] p-2.5 rounded-lg border border-white/5 break-all max-h-40 overflow-y-auto custom-scrollbar';
                log.textContent = text;
                wrapper.appendChild(log);
            } else {
                wrapper.className = `max-w-[80%] flex flex-col gap-1.5 ${sender === 'user' ? 'self-end items-end' : 'self-start items-start'}`;

                const bubble = document.createElement('div');
                bubble.className = `px-5 py-3.5 rounded-2xl text-sm leading-relaxed border ${
                    sender === 'user' 
                        ? 'bg-purple-500/10 text-purple-200 border-purple-500/20 rounded-tr-sm' 
                        : text.startsWith('[Agent Status]:')
                            ? 'bg-purple-950/5 text-purple-300 border-purple-900/10 font-mono text-xs rounded-tl-sm'
                            : 'bg-white/5 text-gray-300 border-white/5 rounded-tl-sm'
                }`;
                bubble.textContent = text;
                
                const senderLabel = document.createElement('span');
                senderLabel.className = 'text-[9px] text-gray-600 uppercase tracking-widest font-bold px-1';
                senderLabel.textContent = sender === 'user' ? 'Developer' : 'Agent';

                wrapper.appendChild(bubble);
                wrapper.appendChild(senderLabel);
            }

            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function setStatus(text) {
            if (text) {
                statusText.textContent = text;
                statusBar.classList.remove('hidden');
            } else {
                statusBar.classList.add('hidden');
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function connect() {
            // Close existing socket if open
            if (ws) {
                ws.onclose = null;
                ws.close();
            }

            connectionBadge.textContent = 'Connecting...';
            connectionBadge.className = 'inline-flex items-center px-2 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider bg-yellow-500/10 text-yellow-400 border border-yellow-500/20';

            const query = currentSessionId ? `?session_id=${encodeURIComponent(currentSessionId)}` : '';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws${query}`;
            serverUrlDisplay.textContent = wsUrl;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                connectionBadge.textContent = 'Active';
                connectionBadge.className = 'inline-flex items-center px-2 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider bg-green-500/10 text-green-400 border border-green-500/20 shadow-[0_0_10px_rgba(34,197,94,0.2)]';
                btnSend.disabled = false;
            };

            ws.onmessage = (event) => {
                const msg = event.data;
                
                // Parse session metadata
                if (msg.startsWith('[Session ID]:')) {
                    currentSessionId = msg.replace('[Session ID]:', '').trim();
                    loadHistoryList();
                    return;
                }

                // Parse history replays
                if (msg.startsWith('[History ')) {
                    const match = msg.match(/^\[History\s+(\w+)\]:\s*([\s\S]*)$/);
                    if (match) {
                        const sender = match[1];
                        const text = match[2];
                        addMessage(sender, text, true);
                    }
                    return;
                }

                if (msg === '[History End]') {
                    addMessage('agent', '[Session Restored Successfully]', true);
                    return;
                }

                if (msg.startsWith('[Agent Status]:')) {
                    setStatus(msg.replace('[Agent Status]:', '').trim());
                } else {
                    setStatus(null);
                    addMessage('agent', msg);
                }
            };

            ws.onclose = () => {
                connectionBadge.textContent = 'Offline';
                connectionBadge.className = 'inline-flex items-center px-2 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider bg-red-500/10 text-red-400 border border-red-500/20';
                btnSend.disabled = true;
                setStatus(null);
                // Attempt reconnect after 3 seconds if not deliberately disconnected
                setTimeout(connect, 3000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        // Load History Sessions from API
        async function loadHistoryList() {
            try {
                const res = await fetch('/sessions');
                if (!res.ok) return;
                const sessions = await res.json();
                
                if (!sessions || sessions.length === 0) {
                    historyList.innerHTML = `<p class="text-[11px] text-gray-650 italic text-center py-4">No sessions found</p>`;
                    return;
                }
                
                historyList.innerHTML = '';
                sessions.forEach(sess => {
                    const activeClass = currentSessionId === sess.session_id 
                        ? 'bg-purple-500/10 border-purple-500/25' 
                        : 'hover:bg-white/[0.03] border-transparent';
                    
                    const div = document.createElement('div');
                    div.className = `p-3 rounded-xl cursor-pointer border transition-all text-left flex flex-col gap-1 ${activeClass}`;
                    div.onclick = () => {
                        if (currentSessionId !== sess.session_id) {
                            currentSessionId = sess.session_id;
                            messagesContainer.innerHTML = '';
                            connect();
                        }
                    };
                    
                    const title = document.createElement('p');
                    title.className = `text-xs font-semibold truncate ${currentSessionId === sess.session_id ? 'text-purple-300' : 'text-gray-300'}`;
                    title.textContent = sess.title || 'Untitled Chat';
                    
                    const date = document.createElement('p');
                    date.className = 'text-[9px] text-gray-500 font-mono';
                    date.textContent = new Date(sess.updated_at).toLocaleString();
                    
                    div.appendChild(title);
                    div.appendChild(date);
                    historyList.appendChild(div);
                });
            } catch (err) {
                console.error("Error loading sessions", err);
            }
        }

        // Send messages
        function sendMessage(text) {
            if (!text.trim() || !ws || ws.readyState !== WebSocket.OPEN) return;
            addMessage('user', text);
            ws.send(text);
            userInput.value = '';
            userInput.style.height = 'auto';
        }

        // Textarea height auto-grow and enter key triggers
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(this.value);
            }
        });

        inputForm.addEventListener('submit', function(e) {
            e.preventDefault();
            sendMessage(userInput.value);
        });

        // Quick Actions
        btnScan.addEventListener('click', () => sendMessage('Scan my workspace directory'));
        btnTest.addEventListener('click', () => sendMessage('Run local validation test on real_resnet_config.json'));
        btnDeploy.addEventListener('click', () => sendMessage('Deploy my model configuration'));

        btnNewChat.addEventListener('click', () => {
            currentSessionId = null;
            messagesContainer.innerHTML = '';
            connect();
        });

        // Initialize connection and history list
        connect();
    </script>
</body>
</html>
