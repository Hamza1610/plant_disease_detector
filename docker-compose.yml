services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omnivax-backend
    restart: always
    environment:
      - VIRTUAL_HOST=${DOMAIN_NAME}.sslip.io
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=${DOMAIN_NAME}.sslip.io
      - LETSENCRYPT_EMAIL=${SSL_EMAIL}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./benchmarks:/app/benchmarks
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - omnivax-network
    depends_on:
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omnivax-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    restart: always
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./benchmarks:/app/benchmarks
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - omnivax-network
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: omnivax-redis
    restart: always
    networks:
      - omnivax-network

  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro
    restart: always
    networks:
      - omnivax-network

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    depends_on:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs
    environment:
      - DEFAULT_EMAIL=${SSL_EMAIL}
      - NGINX_PROXY_CONTAINER=nginx-proxy
    restart: always
    networks:
      - omnivax-network

volumes:
  vhost:
  html:
  certs:
  data:

networks:
  omnivax-network:
    driver: bridge
