[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivax"
version = "2.0.0"
description = "Omnivax is an enterprise-grade, model-first plant disease AI platform featuring a searchable model catalog, real-time prediction APIs, asynchronous hub deployments, and automated benchmark verification."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "supabase>=1.0.0",
]

[project.scripts]
omnivax = "omnivax.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnivax*"]
